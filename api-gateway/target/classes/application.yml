spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # Let the gateway build routes automatically from service names in Eureka,
          # but we also spell them out below so the URLs stay clean and predictable.
          discovery:
            locator:
              enabled: false
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth/**

            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/customers/**

            - id: policy-service
              uri: lb://policy-service
              predicates:
                - Path=/properties/**,/policies/**,/payments/**

            - id: claim-service
              uri: lb://claim-service
              predicates:
                - Path=/claims/**

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/notifications/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Shared signing secret - must match auth-service so the gateway can verify
# the tokens auth-service mints.
jwt:
  secret: ${JWT_SECRET}

spring.application.name=notification-service
server.port=8085

# Own database (database-per-service).
spring.datasource.url=jdbc:mysql://localhost:3306/home_insurance_notification?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Register with Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Proves an incoming request came through the API gateway (or from a sibling
# service forwarding it). Must match the gateway's gateway.shared-secret.
gateway.shared-secret=${GATEWAY_SHARED_SECRET}
